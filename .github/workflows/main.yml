name: Monitoramento Climatico Obra
on:
  schedule:
    # 09h UTC = 06h Brasília
    # 11h UTC = 08h Brasília
    # 13h UTC = 10h Brasília
    # 15h UTC = 12h Brasília
    # 17h UTC = 14h Brasília
    # 19h UTC = 16h Brasília
    # 22h UTC = 19h Brasília (Planejamento 7 dias)
    # 23h UTC = 20h Brasília (Foco Amanhã)
    - cron: '0 9,11,13,15,17,19,22,23 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install requests pytz
      - name: Run script
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python clima.py
